name = "advocate-not-adversary"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[durable_objects]
bindings = [
  { name = "SITE_STATE", class_name = "SiteState" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteState"]

[vars]
SITE_NAME = "Advocate Not Adversary"
OWNER_NAME = "Christopher M. Caballero"
OWNER_EMAIL = "owner@advocatenotadversary.com"

# Secrets (set via `wrangler secret put`):
# GROQ_API_KEY
# NVIDIA_API_KEY
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# ADMIN_PASSWORD_HASH
# SESSION_SECRET
